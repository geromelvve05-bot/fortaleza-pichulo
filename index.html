<style id="fortaleza-theme">
/* =====================================================================

:root{
  --bg:#050b1c;--bg2:#08122e;--panel:#0d1938;--panel2:#111f47;

}
html{scroll-behavior:smooth;scroll-padding-top:16px}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}

/* ---------- Base ---------- */
body{
  margin:0;color:var(--text);
  font:400 16px/1.55 Barlow,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(rgba(255,255,255,.04) 1.2px, transparent 1.5px) 0 0/14px 14px,
    radial-gradient(1200px 640px at 82% -12%, rgba(37,99,235,.38), transparent 60%),
    radial-gradient(900px 620px at -12% 104%, rgba(225,29,42,.20), transparent 62%),
    linear-gradient(180deg,#050b1c 0%,#03060f 100%);
  background-attachment:fixed;
}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.03em;margin:0}
a{color:#7fb0ff}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
main{padding:24px 30px 60px;min-width:0}

/* ---------- Sidebar ---------- */
nav{
  background:linear-gradient(180deg,rgba(11,22,58,.98),rgba(5,10,26,.98));
  border-right:1px solid var(--line);padding:20px 14px;
  position:sticky;top:0;height:100vh;overflow:auto;backdrop-filter:blur(10px);
}
.logo{display:flex;gap:12px;align-items:center;padding:6px 10px 18px;margin-bottom:14px;border-bottom:1px solid var(--line)}

.bk h3{font-family:Oswald,sans-serif;font-weight:600;font-size:14.5px;line-height:1.3;color:#fff;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.bk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:22px;align-items:center}
.fmt{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--muted);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.fmt-hi{color:#1a1400;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent}
.voln{font-size:11px;font-weight:700;color:var(--muted)}
.pri{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:3px 7px}
.pri-urgente{background:rgba(225,29,42,.22);color:#ff9298}
.pri-alta{background:rgba(245,197,24,.16);color:var(--gold2)}
.bk-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px}
.price{font-family:Anton;font-size:16px;color:var(--gold2);letter-spacing:.02em}

/* ---------- Chips / selos ---------- */
.chip{display:inline-block;border:0;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.10)}
.s-comprado{color:#4ade80}.s-esgotado,.s-cancelado{color:#ff6b74}
.s-prevenda{color:var(--gold2)}.s-quero,.s-pesquisando{color:#8fb4ff}
.demo{color:#1a1400;background:linear-gradient(180deg,var(--gold2),var(--gold));border:0;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:800}
.good{color:#4ade80}.warn{color:#ff6b74}

/* ---------- Links de capa ---------- */
.cvs{display:block;margin-top:10px;text-align:center;background:linear-gradient(180deg,rgba(59,130,246,.95),rgba(37,99,235,.85));color:#fff;border:0;border-radius:10px;padding:10px;font-weight:700;font-size:13.5px;text-decoration:none;box-shadow:0 14px 26px -16px rgba(37,99,235,.95);min-height:44px;transition:filter .18s}
.cvs:hover,.cvs:focus-visible{background:linear-gradient(180deg,var(--red2),var(--red));filter:brightness(1.03)}

/* ---------- Painéis ---------- */
.panel{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 26px 52px -38px rgba(0,0,0,.98)}
.bar{height:12px;background:rgba(255,255,255,.10);border:0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--gold));box-shadow:0 0 16px rgba(245,197,24,.55)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.li{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 12px;border-top:1px solid var(--line);border-radius:12px;align-items:center;cursor:pointer;transition:background .18s}
.li:hover{background:rgba(255,255,255,.05)}
.li b{color:#fff}
.mt{color:var(--muted);font-size:13px}
#pg .mt{color:var(--muted)}
#pg>.li{border-color:var(--line)}

/* ---------- Estante / volumes ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:10px}
.vol{text-align:center;padding:8px 0;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.07)}
.vol.have{background:linear-gradient(180deg,#2ee06a,#15803d);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 8px 18px -10px rgba(34,197,94,.9)}

/* ---------- Abas e filtros ---------- */
#tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
#tabs button{border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);padding:9px 18px;font-weight:700;box-shadow:none;font-size:14px}
#tabs button:hover{background:rgba(255,255,255,.14);color:#fff;transform:none;filter:none}
#tabs button.on{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border-color:transparent;box-shadow:0 14px 28px -14px rgba(37,99,235,.95)}
.catbar{align-items:center;margin-bottom:8px}
.catflt{margin-bottom:8px;padding:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px}
.chip-b{border-radius:99px;padding:8px 18px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);box-shadow:none}
.chip-b.on{background:linear-gradient(180deg,var(--red2),var(--red));border-color:transparent;color:#fff;box-shadow:0 14px 28px -14px rgba(225,29,42,.95)}

/* ---------- Miniaturas / widgets ---------- */
.mini{display:block;width:46px;aspect-ratio:2/3;flex:none;border:1px solid var(--line2);border-radius:8px;background:linear-gradient(160deg,#122a5e,#08132e);overflow:hidden;cursor:pointer;position:relative;text-align:center}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini .sh{width:26px;height:auto;margin:8px auto 0;display:block}
.mini span{position:absolute;inset:auto 0 0;background:rgba(5,10,26,.92);color:#fff;font-size:10px;line-height:1.4}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
details.w{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.04);color:var(--text)}
summary{cursor:pointer;font-weight:700;color:#dfe8ff}
.tvw{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.06)}
.tvw label{display:inline-flex;flex-direction:row;align-items:center;gap:8px;white-space:nowrap;font-size:13px;font-weight:600;color:#dfe8ff;margin:0}
.tvw input{width:64px;min-height:34px;padding:2px 8px;text-align:center}
.tvw button{min-height:34px;padding:2px 14px;font-weight:700}
.cvb{display:block;margin-top:10px;text-align:center;cursor:text;background:rgba(245,197,24,.12);color:#ffe98a;border:2px dashed rgba(245,197,24,.55);border-radius:12px;padding:11px;font-size:14px;font-weight:600;min-height:46px}
.cvb:focus{background:rgba(245,197,24,.22);color:#fff;outline:none}
.mvw{display:flex;flex-direction:column}
.mvw[draggable="true"]{cursor:grab}.mvw[draggable="true"]:active{cursor:grabbing}
.mvw.mvdrag{opacity:.35}
.mvw.mvover{outline:3px dashed var(--gold);outline-offset:6px;border-radius:12px}
.mvhint{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.ctb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 14px}
.ctb .dng{margin-left:auto;background:transparent;color:#ff6b74;border:1px solid rgba(255,90,99,.5)}
.ctb .dng:hover{background:var(--red);color:#fff}
.li[data-gvid]{cursor:grab;-webkit-user-select:none;user-select:none}

/* ---------- Botões ---------- */
button{cursor:pointer;font:inherit;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--line2);border-radius:11px;padding:9px 14px;min-height:40px;font-weight:700;box-shadow:none;transition:background .18s,transform .12s,filter .18s,border-color .18s}
button:hover{background:rgba(255,255,255,.17);border-color:var(--line2);transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button.add{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;border-color:transparent;box-shadow:0 14px 28px -14px rgba(225,29,42,.95)}
button.add:hover{filter:brightness(1.04)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Formulários ---------- */
input,select,textarea{font:inherit;color:#fff;background:rgba(6,12,30,.72);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;min-height:44px;transition:border-color .18s,box-shadow .18s}
input::placeholder,textarea::placeholder{color:#7d8fbd}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,130,246,.28)}
select option{background:#0b1636;color:#fff}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px;font-weight:600}
label.w,.w{grid-column:1/-1}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* =====================================================================
   DIÁLOGOS
   ===================================================================== */
dialog{background:#0a1330;color:var(--text);border:1px solid var(--line2);border-radius:20px;box-shadow:0 50px 100px -40px rgba(0,0,0,.98)}
dialog::backdrop{background:rgba(2,5,14,.76);backdrop-filter:blur(8px)}
#dlg{padding:0;width:min(800px,94vw);overflow:auto}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px;background:linear-gradient(120deg,#0b1b46,#12224f);color:#fff;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;color:#fff;font-size:23px;line-height:1.15;text-shadow:none}
.dmeta{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.dhead .chip{background:rgba(255,255,255,.14)}
.dhead .mt{color:#c3d0f5;font-weight:600}
.xclose{width:38px;height:38px;min-height:0;padding:0;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;background:rgba(255,255,255,.10);color:#fff;border:0;box-shadow:none}
.xclose:hover{background:rgba(255,255,255,.22);transform:none}
.dlead{padding:16px 20px 0;margin:0;font-weight:700;color:#fff}
.det{display:grid;grid-template-columns:224px 1fr;gap:22px;padding:20px;align-items:start}
.dside{display:flex;flex-direction:column;gap:12px}
.dside .cv{border-radius:14px}
.dmain{min-width:0}
.sinopse{color:#c9d8ff;line-height:1.65;margin:0 0 14px;font-size:15px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px;margin:0 0 14px}
.spec{background:rgba(255,255,255,.05);border-left:3px solid var(--blue2);border-radius:11px;padding:9px 12px;min-width:0}
.spec span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin-bottom:2px}
.spec b{color:#fff;font-weight:700;word-break:break-word}
.note{background:rgba(245,197,24,.10);border-left:4px solid var(--gold);border-radius:11px;padding:10px 13px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px}
.note b{color:var(--gold2);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.note span{color:#e6ecff;line-height:1.5}
.dsub{margin:4px 0 10px;font-size:16px;color:#fff;display:flex;gap:8px;align-items:baseline;font-family:Anton,Impact,sans-serif;letter-spacing:.05em}
.dsub small{font-weight:600;color:var(--muted);font-family:Barlow;letter-spacing:0;font-size:12px}
.offers{display:flex;flex-direction:column;gap:8px}
.offer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.offer .rank{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.10);color:#c3d0f5;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.offer .best{background:linear-gradient(180deg,#2ee06a,#15803d);color:#fff;border-radius:99px;padding:3px 11px;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.offer b{color:#fff}
.oprice{color:var(--muted);margin-left:auto}
.offer a{color:#7fb0ff;font-weight:700;text-decoration:none;white-space:nowrap}
.offer a:hover{text-decoration:underline}
.dbar{padding:14px 20px 0}
.dplain{padding:16px 20px 4px;color:var(--text)}
.dfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;padding:14px 20px 18px;border-top:1px solid var(--line);background:rgba(5,10,26,.55);margin-top:16px;position:sticky;bottom:0;z-index:2}
.dfoot a.alink{text-decoration:none}
.dfoot .ghost{background:transparent;color:#c9d8ff;box-shadow:inset 0 0 0 1.5px var(--line2)}
.dfoot .ghost:hover{background:rgba(255,255,255,.10)}
.dfoot .dng{background:transparent;color:#ff8a90;box-shadow:inset 0 0 0 1.5px rgba(255,90,99,.5)}
.dfoot .dng:hover{background:var(--red);color:#fff}
.dfoot .ok{background:linear-gradient(180deg,#2ee06a,#15803d);color:#fff;border-color:transparent;box-shadow:0 14px 28px -14px rgba(34,197,94,.9)}
#dlg form{display:block;padding:16px 20px 0}
#dlg form .dfoot{margin-left:-20px;margin-right:-20px}
.fsec{margin-bottom:16px}
.fshead{font-family:Anton,Impact,sans-serif;font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:10px}
.fshead::after{content:"";height:1px;flex:1;background:var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
#dlg details.acc{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden}
#dlg details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:Anton,Impact,sans-serif;letter-spacing:.09em;text-transform:uppercase;font-size:12.5px;color:#dfe8ff;display:flex;align-items:center;gap:10px}
#dlg details.acc>summary::-webkit-details-marker{display:none}
#dlg details.acc>summary::before{content:"+";width:20px;height:20px;border-radius:6px;background:var(--blue2);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Barlow;font-weight:800;font-size:14px;line-height:1}
#dlg details.acc[open]>summary::before{content:"–";background:var(--red)}
#dlg details.acc>summary:hover{background:rgba(255,255,255,.05)}
#dlg details.acc .g{padding:2px 16px 16px}
.fgerr{background:rgba(225,29,42,.18);color:#ffb3b8;font-weight:700;padding:10px 13px;border-radius:10px;border-left:4px solid var(--red);margin-bottom:12px}

/* Confirmação */
.askdlg{width:min(410px,92vw);border-radius:18px;padding:0;overflow:hidden}
.ask-top{display:flex;gap:14px;align-items:flex-start;padding:22px 22px 6px}
.ask-ic{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;font-family:Anton,Impact,sans-serif;font-size:23px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 22px -12px rgba(225,29,42,.95)}
.ask-msg{margin:5px 0 0;font-weight:600;color:#eef4ff;line-height:1.5}
.ask-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 20px;border-top:1px solid var(--line);background:rgba(5,10,26,.55);margin-top:16px}
.ask-foot .ghost{background:transparent;color:#c9d8ff;box-shadow:inset 0 0 0 1.5px var(--line2)}
.ask-foot .dng{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;border-color:transparent}

/* Corrige cores herdadas do tema anterior (maior especificidade) */
#pg .panel .mt,#pg .st span,dialog .mt{color:var(--muted)}
dialog a{color:#7fb0ff!important}

/* ---------- Entrada suave ---------- */
#pg>*{animation:fp .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Responsivo ---------- */
@media(max-width:980px){.app{grid-template-columns:1fr}}
@media(max-width:760px){
  nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;gap:4px;overflow-x:auto;z-index:20;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-right:0;background:linear-gradient(180deg,rgba(11,22,58,.99),rgba(5,10,26,.99))}
  nav button{white-space:nowrap;width:auto;margin:0;padding:9px 12px;flex-direction:column;gap:4px;font-size:11px}
  nav button span{font-size:11px}
  nav button.on::after{display:none}
  .logo{display:none}
  main{padding:14px 14px 104px}
  .hero{min-height:330px;border-radius:18px}
  .hero .cap{padding:30px 22px 28px}
  .hero h1{font-size:clamp(28px,8.4vw,40px)}
  .hero p{font-size:15px}
  .hero-shield{width:220px;opacity:.09}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
  .st b{font-size:26px}
  .det{grid-template-columns:1fr;gap:16px;padding:16px}
  .dside{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .dside .cv{width:132px;flex:none}
  .dside .cvb,.dside .cvs{width:100%}
  .dhead{padding:15px 16px}
  #dlg form{padding:14px 16px 0}
  #dlg form .dfoot{margin-left:-16px;margin-right:-16px}
  .dfoot{padding:12px 16px 16px}
  .oprice{margin-left:0;width:100%}
  .dbar{padding:12px 16px 0}
  .dplain{padding:12px 16px 4px}
}
@media(prefers-reduced-motion:reduce){
  #pg>*{animation:none!important}
  .bk:hover{transform:none}
  .hero .mq,.bk .cv img{transition:none}
  .hv,.hv-pane,.toast{animation:none!important}
}

/* ===================== FICHA DA EDIÇÃO (detalhes) ===================== */
#dlg.hv-dlg{width:min(1120px,96vw)}
.hv{animation:hvIn .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes hvIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.hv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,rgba(11,27,70,.96),rgba(18,34,79,.72));position:sticky;top:0;z-index:4;backdrop-filter:blur(8px)}
.hv-crumb{font:800 11px/1 Oswald,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.fbar-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.fbar-t b{color:#fff;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}
.dirty{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--gold2);background:rgba(245,197,24,.14);border:1px solid rgba(245,197,24,.4);border-radius:99px;padding:5px 11px;opacity:0;transform:translateY(-4px);transition:.25s;white-space:nowrap}
.dirty.on{opacity:1;transform:none}

.hv-hero{display:grid;grid-template-columns:268px 1fr;gap:30px;padding:28px 30px 24px;align-items:start}
.hv-cover{display:flex;flex-direction:column;gap:12px;position:sticky;top:78px}
.hv-cover .cv{border-radius:16px;box-shadow:0 34px 54px -28px rgba(0,0,0,.98),inset 0 0 0 1px rgba(255,255,255,.10);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.hv-cover .cv:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 44px 66px -28px rgba(0,0,0,.98),inset 0 0 0 2px var(--gold)}
.hv-info{min-width:0}
.hv-title{font-size:clamp(28px,3.6vw,46px);line-height:1.02;color:#fff;margin:12px 0 0;text-shadow:0 10px 34px rgba(0,0,0,.7)}
.hv-sub{color:var(--muted);margin:10px 0 0;font-size:15px;font-weight:600}
.hv-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.hv-credits{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
.cred{color:#dbe6ff;font-size:14px}
.cred b{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:2px}
.hv-facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.fact{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;color:#dfe8ff}
.fact.price{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1400;border-color:transparent;font-family:Anton,Impact,sans-serif;font-size:17px;letter-spacing:.02em}
.hv-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn-edit{background:linear-gradient(180deg,rgba(59,130,246,.96),rgba(37,99,235,.9));color:#fff;border-color:transparent;box-shadow:0 16px 30px -16px rgba(37,99,235,.98)}
.btn-edit:hover{filter:brightness(1.06)}
.hv-actions .ok{background:linear-gradient(180deg,#2ee06a,#15803d);color:#fff;border-color:transparent;box-shadow:0 16px 30px -16px rgba(34,197,94,.9)}

.hv-tabs{margin:0 30px;border-top:1px solid var(--line)}
.hv-tabs>input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.hv-tabs>label{display:inline-flex;align-items:center;padding:15px 18px;cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.hv-tabs>label:hover{color:#fff}
#hvt1:checked~label[for="hvt1"],#hvt2:checked~label[for="hvt2"],#hvt3:checked~label[for="hvt3"],#hvt4:checked~label[for="hvt4"]{color:#fff;border-bottom-color:var(--gold)}
.hv-panes{padding:20px 0 6px}
.hv-pane{display:none}
#hvt1:checked~.hv-panes .p1,#hvt2:checked~.hv-panes .p2,#hvt3:checked~.hv-panes .p3,#hvt4:checked~.hv-panes .p4{display:block;animation:paneIn .3s ease both}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hv-h{font-family:Anton,Impact,sans-serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin:4px 0 12px;display:flex;align-items:center;gap:10px}
.hv-h::before{content:"";width:4px;height:16px;border-radius:99px;background:linear-gradient(180deg,var(--red),var(--gold))}
.hv-h small{font-family:Barlow,sans-serif;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px}
.syn-block{background:linear-gradient(160deg,rgba(59,130,246,.10),rgba(255,255,255,.02));border-left:4px solid var(--blue2);border-radius:0 14px 14px 0;padding:16px 18px;margin-bottom:22px}
.syn-text{color:#dbe6ff;line-height:1.75;font-size:15.5px;margin:0;max-width:80ch}
.syn-text.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.syn-chk{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.syn-chk:checked~.syn-text.clamp{display:block;-webkit-line-clamp:unset;overflow:visible}
.syn-more{display:inline-block;margin-top:12px;color:var(--gold2);font-weight:800;cursor:pointer;font-size:13.5px;user-select:none}
.syn-more::before{content:"Ler sinopse completa"}
.syn-more::after{content:" ↓"}
.syn-chk:checked~.syn-more::before{content:"Mostrar menos"}
.syn-chk:checked~.syn-more::after{content:" ↑"}
.empty{color:var(--muted);font-style:italic;padding:4px 0}
.linkrow{display:flex;justify-content:space-between;gap:12px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 15px;text-decoration:none;color:#fff;margin-bottom:18px;transition:border-color .2s}
.linkrow:hover{border-color:var(--gold)}
.linkrow span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.linkrow b{color:#7fb0ff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
.hv-foot{margin-top:0}

/* Toast de feedback */
#toastbox{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:linear-gradient(135deg,#0b1b46,#12224f);color:#fff;border:1px solid var(--line2);border-left:4px solid var(--gold);border-radius:12px;padding:12px 18px;font-weight:700;box-shadow:0 22px 44px -18px rgba(0,0,0,.98);animation:toastIn .3s ease both}
.toast.out{opacity:0;transform:translateY(10px);transition:.45s}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media(max-width:760px){
  .hv-hero{grid-template-columns:1fr;gap:20px;padding:18px 16px 20px}
  .hv-cover{position:static;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .hv-cover .cv{width:148px;flex:none}
  .hv-cover .cvb,.hv-cover .cvs{width:100%}
  .hv-title{font-size:26px}
  .hv-tabs{margin:0 16px;overflow-x:auto;white-space:nowrap}
  .hv-tabs>label{padding:13px 12px;font-size:13px}
  .hv-panes{padding:16px 0 4px}
  .linkrow b{max-width:50%}
  .fbar-t b{max-width:52vw}
}

</style>

var SYN={"Demolidor por Brian Michael Bendis|2":"A identidade secreta de Matt Murdock vira manchete: os jornais revelam que o herói mascarado da Cozinha do Inferno é um advogado cego. Matt enfrenta a batalha judicial contra o jornal, enquanto seu escritório vira alvo de vilões e a ausência do Rei do Crime deixa o bairro em ebulição. Roteiro de Brian Michael Bendis e arte de Alex Maleev.","Demolidor por Brian Michael Bendis|3":"Fecha o ciclo de Bendis e Maleev com arcos que mostram o que aconteceu durante o ano em que o próprio Demolidor assumiu o lugar do Rei do Crime, além de uma história construída em torno dos Dez Mandamentos, com participações de Nick Fury e dos Vingadores.","Elektra Assassina|":"Escrita por Frank Miller e desenhada por Bill Sienkiewicz, mergulha na mente fragmentada de Elektra, a assassina de aluguel, numa trama de espionagem e conspiração com visual experimental e violento.","Desafio Infinito|":"Thanos reúne as Joias do Infinito na Manopla do Infinito e ganha poder quase absoluto, disposto a eliminar metade da vida do universo para conquistar o amor da Morte. Heróis da Terra e seres cósmicos se unem numa última tentativa de detê-lo.","A Última Caçada de Kraven|":"Kraven, o Caçador, decide provar que é superior ao Homem-Aranha: derrota o herói, o enterra vivo e assume a identidade dele pelas ruas de Nova York. Uma história sombria e psicológica, de J. M. DeMatteis e Mike Zeck, considerada um clássico do personagem.","O Homem Sem Medo|":"Reconta a origem do Demolidor: a juventude de Matt Murdock, o acidente que o deixou cego e com sentidos aguçados, o treino com Stick e a escolha de lutar contra o crime. Por Frank Miller e John Romita Jr.","Os Fabulosos X-Men: Edição Definitiva|7":"Mais um volume da coleção definitiva dos Fabulosos X-Men, que reúne a longa fase de Chris Claremont à frente da equipe de mutantes, com as aventuras e os dramas de heróis perseguidos pelo mundo que juraram proteger.","Superman por Geoff Johns: O Último Filho|3":"Uma nave kryptoniana cai em Metrópolis trazendo um menino com todos os poderes do Superman. O Homem de Aço quer protegê-lo e criá-lo como filho, mas as autoridades desconfiam da criança e de sua origem. Escrita por Geoff Johns e Richard Donner, com arte de Adam Kubert.","A Saga do Superman|5":"Volume da coleção da Panini que reúne, em ordem cronológica, histórias clássicas do Superman.","Batman & Robin: Ano Um|1":"Conta os primeiros tempos da parceria entre Batman e Robin, quando a dupla dinâmica começa a se formar nas ruas de Gotham.","Crise de Identidade|":"O assassinato de Sue Dibny, esposa do Homem-Elástico, abala a comunidade de heróis. Enquanto a Liga da Justiça investiga, segredos do passado do grupo vêm à tona e põem a confiança entre os heróis à prova. Escrita por Brad Meltzer, com arte de Rags Morales.","Absolute Caçador de Marte|4":"Volume da linha Absolute, da DC, que reimagina os grandes heróis num universo mais sombrio e brutal. Aqui, acompanha o Caçador de Marte nessa nova versão.","Supergirl: Mulher do Amanhã|":"Kara Zor-El, a Supergirl, acompanha a jovem Ruthye numa jornada pelo espaço em busca de vingança contra o assassino do pai dela. Uma história de aventura e melancolia, escrita por Tom King e desenhada por Bilquis Evely.","Transformers: Robôs Disfarçados|1":"Primeiro volume da série em que Autobots e Decepticons continuam sua guerra, desta vez com a Terra no meio do conflito."};

var NEW4=[{"titulo": "Absolute Batman 03", "personagem": "Batman", "editora": "DC", "formato": "Outro", "vol": "3", "colecao": "Absolute Batman", "status": "prevenda", "preco": 24.9, "link": "https://panini.com.br/absolute-batman-03", "roteirista": "Scott Snyder", "desenhista": "Nick Dragotta", "sinopse": "Encerra o primeiro arco de Absolute Batman, \"O Zoológico\". Bruce Wayne enfrenta o Máscara Negra e sua gangue enquanto tenta proteger os amigos e manter seus princípios. Em meio à derrota e ao caos, o passado com James Gordon e antigos conhecidos como Edward Nygma, Harvey Dent e Oswald Cobblepot volta para moldar seu legado como vigilante de Gotham. Fecha com grandes revelações e abre caminho para a próxima fase do herói.", "notas": "Pré-venda, previsão de envio na 2ª quinzena de Nov/26. Revista em formato canoa, 48 páginas. Reúne Absolute Batman 5-6 (edições originais). Classificação 14 anos. Ref. ABATM003.", "editoraBR": "Panini", "loja": "Panini"}, {"titulo": "Absolute Batman 02", "personagem": "Batman", "editora": "DC", "formato": "Outro", "vol": "2", "colecao": "Absolute Batman", "status": "prevenda", "preco": 24.9, "link": "https://panini.com.br/absolute-batman-02-abatm002r", "roteirista": "Scott Snyder", "desenhista": "Nick Dragotta", "sinopse": "Batman e Alfred tentam formar uma aliança, mas o Máscara Negra também reuniu novos aliados, ansiosos para chegar a Gotham City e causar destruição total. A edição ainda revela um segredo sombrio de Bruce, capaz de abalar suas estruturas e fazê-lo questionar tudo o que fez até agora.", "notas": "Pré-venda, previsão de envio na 2ª quinzena de Nov/26. Revista em formato canoa, 56 páginas. Reúne Absolute Batman (2024) 3-4. Classificação 14 anos. Ref. ABATM002R.", "editoraBR": "Panini", "loja": "Panini"}, {"titulo": "Absolute Batman 01", "personagem": "Batman", "editora": "DC", "formato": "Outro", "vol": "1", "colecao": "Absolute Batman", "status": "prevenda", "preco": 19.9, "link": "https://panini.com.br/absolute-batman-01", "roteirista": "Scott Snyder", "desenhista": "Nick Dragotta", "sinopse": "Porta de entrada do Universo Absolute, em que os heróis da DC são reinventados do zero, com novas origens que mudam suas habilidades e circunstâncias sem perder a essência. Aqui, Batman fica sem a mansão, sem a fortuna e sem o mordomo: sobra apenas um Cavaleiro das Trevas absoluto, reimaginado por Scott Snyder e Nick Dragotta.", "notas": "Edição especial de lançamento com preço promocional. Pré-venda, previsão de envio na 2ª quinzena de Dez/26. Revista em formato canoa, 72 páginas. Reúne Absolute Batman 1-2. Classificação 14 anos. Ref. ABATM001R.", "editoraBR": "Panini", "loja": "Panini"}, {"titulo": "Elektra Assassina", "personagem": "Elektra", "editora": "Marvel", "formato": "Capa dura", "vol": "", "colecao": "", "status": "quero", "preco": 106.43, "link": "https://panini.com.br/elektra-assassina-aelea001", "roteirista": "Frank Miller", "desenhista": "Bill Sienkiewicz", "sinopse": "Treinada no ninjutsu pelo Tentáculo, Elektra Natchios é a arma viva mais letal do planeta. Ex-amante de Matt Murdock, o Demolidor, foi morta pelo Mercenário e trazida de volta por Stick e seus Virtuosos. Quando uma mulher misteriosa surge inconsciente nas praias de um pequeno país sul-americano, eventos terríveis começam a acontecer. Aventura de ação, mistério, humor negro e grandes reviravoltas, nascida da parceria entre Frank Miller e Bill Sienkiewicz.", "notas": "Preço especial na Panini (preço cheio R$ 141,90). Capa dura, 272 páginas. Reúne Elektra: Assassin 1-8. Classificação 12 anos. Ref. AELEA001.", "editoraBR": "Panini", "loja": "Panini"}, {"titulo": "Transformers Vol. 1 - Robôs Disfarçados", "personagem": "Transformers", "editora": "Skybound", "formato": "Capa cartão", "vol": "1", "colecao": "Transformers (Universo Energon)", "status": "quero", "preco": 16.92, "link": "https://panini.com.br/transformers-vol-1-robos-disfarcados-universo-energon-01", "roteirista": "Daniel Warren Johnson", "desenhista
